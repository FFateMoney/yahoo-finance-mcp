name: fetch-sec
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-03k1wx]
    paths: [research/fullflow/fetch_sec.py, .github/workflows/fetch-sec.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas requests
      - run: mkdir -p research/fullflow/data && python research/fullflow/fetch_sec.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add research/fullflow/data
          git commit -m "data: SEC earnings dates and XBRL facts"
          git pull --rebase
          git push
