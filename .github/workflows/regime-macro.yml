name: regime-macro
on:
  workflow_dispatch:
  push:
    paths: [research/regime/fetch_macro.py, research/regime/fetch_quote.py]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install "yfinance>=0.2.50" pandas
      - run: python research/regime/fetch_macro.py && python research/regime/fetch_quote.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add research/regime/data
          git diff --cached --quiet && exit 0
          git commit -q -m "data: regime macro series"
          for i in 1 2 3 4; do git pull --rebase -q && git push -q && exit 0; sleep $((i*5)); done; exit 1
