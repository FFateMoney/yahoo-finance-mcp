name: fetch-factor-data
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-rwrqhj, claude/project-thread-noawok]
    paths: [research/factors/fetch_universe.py, .github/workflows/fetch-factor-data.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "yfinance>=0.2.50" pandas lxml
      - run: mkdir -p research/factors/data && python research/factors/fetch_universe.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add research/factors/data
          git commit -m "data: S&P 500 + S&P 400 daily prices for factor research"
          git pull --rebase
          git push
