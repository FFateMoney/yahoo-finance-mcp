name: fetch-news
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-sl08o9]
    paths: [research/news/tickers.txt, research/news/fetch_news.py, .github/workflows/fetch-news.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python research/news/fetch_news.py --days 21
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add research/news/out
          git commit -m "data: candidate news"
          git pull --rebase
          git push
